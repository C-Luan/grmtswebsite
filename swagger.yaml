      tags:
        - Contracheques
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF do contracheque
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Sem permissão
        "404":
          description: Não encontrado

  /contracheque/upload:
    post:
      summary: Upload de contracheques (arquivos PDF)
      tags:
        - Contracheques
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Upload realizado com sucesso
        "500":
          description: Erro no servidor

