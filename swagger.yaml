  # ══════════════════════════════════════════════
  #  RONDA HISTÓRICO
  # ══════════════════════════════════════════════
  /rondahistorico:
    post:
      summary: Criar registros de ronda em lote
      tags:
        - Ronda Histórico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/RondaHistoricoItem"
      responses:
        "201":
          description: Inserido com sucesso
        "400":
          description: Erro na validação
        "500":
          description: Erro interno do servidor

  /rondahistorico/relatorio:
    get:
      summary: Relatório de ronda
      tags:
        - Ronda Histórico
      parameters:
        - in: query
          name: data_inicio
          required: true
          schema:
            type: string
            format: date
          description: Data inicial para o relatório
        - in: query
          name: data_fim
          required: true
          schema:
            type: string
            format: date
          description: Data final para o relatório
        - in: query
          name: colaboradorId
          required: false
          schema:
            type: integer
        - in: query
          name: idPostoRonda
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: contratoId
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista dos registros de ronda no período
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RondaHistoricoItem"
        "400":
          description: Parâmetros obrigatórios não informados
        "500":
          description: Erro de servidor

